<!doctype html>
<!--
  02 · La calle (acto 1, 84). Entra el contrabajo caminando.
  La calle de la intro, cortada a golpe: cada golpe de la musica es un rechazo.
    tiempo 2 -> le pegan el cartel NO HAY VACANTES en el escaparate (fuente 4,25 s)
    tiempo 4 -> el portazo (fuente 9,0 s): aqui cae el texto, con su temblor
    tiempo 7 -> el NO en la ultima puerta (fuente 11,4 s)
  Los cortes se escriben en TIEMPOS (data-beats) y los instantes de la fuente con data-sync:
  `npm run sync` los convierte a segundos con la hoja de cortes de la musica.
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>02 · La calle</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s02-root"
      data-composition-id="s02"
      data-start="0"
      data-duration="5.716667"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <video data-media-start="2.8167" data-duration="1.4333" data-start="0" id="s02-a" class="clip" src="captures/02_calle.mp4"
          data-beats="0 2" data-sync="4.25@2" data-track-index="0" muted playsinline></video>
        <video data-media-start="4.25" data-duration="0.7167" data-start="1.4333" id="s02-b" class="clip" src="captures/02_calle.mp4"
          data-beats="2 3" data-sync="4.25@2" data-track-index="0" muted playsinline></video>
        <video data-media-start="8.3" data-duration="0.7" data-start="2.15" id="s02-c" class="clip" src="captures/02_calle.mp4"
          data-beats="3 4" data-sync="9.0@4" data-track-index="0" muted playsinline></video>
        <video data-media-start="9" data-duration="1.4333" data-start="2.85" id="s02-d" class="clip" src="captures/02_calle.mp4"
          data-beats="4 6" data-sync="9.0@4" data-track-index="0" muted playsinline></video>
        <video data-media-start="10.6833" data-duration="1.4333" data-start="4.2833" id="s02-e" class="clip" src="captures/02_calle.mp4"
          data-beats="6 end" data-sync="11.4@7" data-track-index="0" muted playsinline></video>
      </div>
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div class="t" id="s02-texto" data-t="line">Nadie te contrata.</div>

      <!-- Los nudillos (fuente 3,75 y 3,95 s), el cartel, el portazo y el NO. -->
      <audio data-start="0.9333" id="s02-nudillos" src="sfx/knock.wav" data-beats="2-0.5s"
        data-duration="0.8" data-volume="0.55" data-track-index="10"></audio>
      <audio data-start="1.4333" id="s02-cartel" src="sfx/sign_slap.wav" data-beats="2"
        data-duration="0.7" data-volume="0.8" data-track-index="11"></audio>
      <audio data-start="2.85" id="s02-portazo" src="sfx/door_slam.wav" data-beats="4"
        data-duration="1.1" data-volume="1" data-track-index="12"></audio>
      <audio data-start="5" id="s02-no" src="sfx/sign_slap.wav" data-beats="7"
        data-duration="0.7" data-volume="0.7" data-track-index="13"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "02-calle";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s02-root");
        document.fonts.ready.then(function () {
          TRAILER.fill(SCENE, ROOT);
          const text = document.getElementById("s02-texto");
          text.style.top = "984px";
          TRAILER.center(text, 960);
          // El texto cae con el portazo, de golpe y con su sacudida.
          const slam = TRAILER.beat(SCENE, 4);
          TRAILER.slam(tl, text, slam);
          TRAILER.jolt(tl, text, slam, 2);
          window.__timelines["s02"] = tl;
        });
      })();
    </script>
  </body>
</html>
