<!doctype html>
<!--
  09 · La barra (120). La musica se tambalea (vaiven de afinacion en la sintesis).
  Corte 1: el tercer whisky doble servido en la barra, con la frase del camarero.
  Corte 2 (tiempo 3): de vuelta al salon con la pantalla meciendose (el vaiven de camara del
  juego) y el aviso de verdad: "¡MODO EBRIO! ... ×1,25". Zoom x2 sobre el aviso.
  El aviso del juego esta en espanol; en ingles se subtitula debajo (texts/en.json).
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>09 · La barra</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s09-root"
      data-composition-id="s09"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <video data-media-start="1.9" data-duration="1.5" data-start="0" id="s09-barra" class="clip" src="captures/09_barra.mp4"
          data-beats="0 3" data-sync="2.4@1" data-track-index="0" muted playsinline></video>
      </div>
      <div class="shot">
        <div class="zoom" style="transform: translate(-960px, -480px) scale(2)">
          <video data-media-start="3.45" data-duration="2.5" data-start="1.5" id="s09-salon" class="clip" src="captures/09_barra.mp4"
          data-beats="3 end" data-sync="3.45@3" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="uibox" id="s09-caja"><div class="t line" data-t="caption"></div></div>

      <audio data-media-start="1.9" data-duration="1.5" data-start="0" id="s09-sonido-barra" src="captures/09_barra.wav" data-beats="0 3" data-sync="2.4@1"
        data-volume="0.48" data-track-index="10"></audio>
      <audio data-media-start="3.45" data-duration="2.5" data-start="1.5" id="s09-sonido-salon" src="captures/09_barra.wav" data-beats="3 end" data-sync="3.45@3"
        data-volume="0.48" data-track-index="11"></audio>
      <audio data-start="0.15" id="s09-vaso" src="sfx/pour.wav" data-beats="1-0.35s" data-duration="2.1"
        data-volume="0.6" data-track-index="12"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "09-barra";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s09-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const box = document.getElementById("s09-caja");
          const caption = box.querySelector(".t");
          tl.set(box, { opacity: 0 }, 0);
          if (caption.textContent.trim()) {
            box.style.top = "855px";
            T.center(box, 960);
            tl.set(box, { opacity: 1 }, T.beat(SCENE, 4));
            T.type(tl, caption, T.beat(SCENE, 4), 40);
          }
          window.__timelines["s09"] = tl;
        });
      })();
    </script>
  </body>
</html>
