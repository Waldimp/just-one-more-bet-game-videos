<!doctype html>
<!--
  12 · Corte en seco. La musica se calla de golpe (el montaje acaba en la dominante y no
  resuelve) y queda el tictac. El HUD de verdad (la tarjeta de arriba a la izquierda) con el
  reloj en 0:00, x3; a los dos segundos, golpe a x7 sobre la cifra. x7 y no x6: a x6 caben 60
  filas de juego y no hay 60 libres entre DIA 1 (filas 13-23) y las fichas de ACCIONES (82-91),
  asi que asomaba un trozo de una o de otras. A x7 (91x51 px de juego desde x 4, y 26) quedan
  solo la cifra y la barra vacia. Sin texto.
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>12 · 0:00</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s12-root"
      data-composition-id="s12"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <div class="zoom" id="s12-zoom">
          <video id="s12-hud" class="clip" src="captures/12_reloj.mp4" data-start="0"
            data-duration="4" data-media-start="0.5" data-track-index="0" muted playsinline></video>
        </div>
      </div>

      <audio id="s12-t0" src="sfx/tick.wav" data-start="0.25" data-duration="0.43"
        data-volume="0.75" data-track-index="10"></audio>
      <audio id="s12-t1" src="sfx/tock.wav" data-start="0.75" data-duration="0.43"
        data-volume="0.6" data-track-index="11"></audio>
      <audio id="s12-t2" src="sfx/tick.wav" data-start="1.25" data-duration="0.43"
        data-volume="0.75" data-track-index="10"></audio>
      <audio id="s12-t3" src="sfx/tock.wav" data-start="1.75" data-duration="0.43"
        data-volume="0.6" data-track-index="11"></audio>
      <audio id="s12-t4" src="sfx/tick.wav" data-start="2.25" data-duration="0.43"
        data-volume="0.75" data-track-index="10"></audio>
      <audio id="s12-t5" src="sfx/tock.wav" data-start="2.75" data-duration="0.43"
        data-volume="0.6" data-track-index="11"></audio>
      <audio id="s12-t6" src="sfx/tick.wav" data-start="3.25" data-duration="0.43"
        data-volume="0.75" data-track-index="10"></audio>
      <audio id="s12-t7" src="sfx/tock.wav" data-start="3.75" data-duration="0.43"
        data-volume="0.6" data-track-index="11"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "12-reloj";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s12-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          // x3 sobre el HUD y golpe de zoom ENTERO a x7 sobre "0:00", en el quinto tic.
          tl.set("#s12-zoom", { x: 0, y: 0, scale: 3 }, 0);
          tl.set("#s12-zoom", { x: -84, y: -546, scale: 7 }, 2.25);
          window.__timelines["s12"] = tl;
        });
      })();
    </script>
  </body>
</html>
