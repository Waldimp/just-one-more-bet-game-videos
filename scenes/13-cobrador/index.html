<!doctype html>
<!--
  13 · El cobrador (acto 3, fuera de tempo). Intriga muy suave: un pedal grave y dos notas.
  Vuelven las bandas de cine. La sala del cobrador del juego, a oscuras: la puerta se
  entreabre, en la rendija la silueta; un brillo cruza la calva y las gafas; asoma la mano
  con el expediente. Nunca termina de entrar. A los 2,6 s, corte a x2 sobre la puerta.
  Texto: "Él siempre llega.", despacio.
-->

  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'

      (function () {
        const SCENE = "13-cobrador";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s13-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const text = document.getElementById("s13-texto");
          text.style.top = "984px";
          T.center(text, 960);
          T.type(tl, text, 3.9, 14);
          window.__timelines["s13"] = tl;
        });
      })();
