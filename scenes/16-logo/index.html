    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "16-logo";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s16-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const texts = T.texts(SCENE);
          // Fondo: la fachada del leon a x3, tapada al 82 % con la tinta.
          Object.assign(document.getElementById("s16-fondo").style, {
            width: "1920px", height: "1080px",
          });
          document.getElementById("s16-velo").style.opacity = "0.82";
          // La ficha: la hoja del juego (4x2 fotogramas de 64 px) a x8, sin suavizado.
          const SIDE = 512;
          const chip = document.getElementById("s16-ficha");
          Object.assign(chip.style, {
            position: "absolute", width: SIDE + "px", height: SIDE + "px",
            backgroundImage: "url(shared/img/logo_chip_sheet.png)",
            backgroundSize: SIDE * 4 + "px " + SIDE * 2 + "px", imageRendering: "pixelated",
          });
          const frame = function (i) {
            const k = i % 8;
            return -(k % 4) * SIDE + "px " + -Math.floor(k / 4) * SIDE + "px";
          };
          // Composicion: ficha a la izquierda y el titulo en dos lineas a su derecha, el grupo
          // centrado; debajo, centrado, lo demas.
          const t1 = document.getElementById("s16-titulo1");
          const t2 = document.getElementById("s16-titulo2");
          const titleW = Math.max(t1.getBoundingClientRect().width, t2.getBoundingClientRect().width);
          const left = T.snap((1920 - (SIDE + 72 + titleW)) / 2);
          chip.style.left = left + "px";
          chip.style.top = "69px";
          t1.style.left = left + SIDE + 72 + "px";
          t2.style.left = left + SIDE + 72 + "px";
          t1.style.top = "153px";
          t2.style.top = "333px";
          const place = function (id, top) {
            const el = document.getElementById(id);
            el.style.top = top + "px";
            T.center(el, 960);
            return el;
          };
          const itch = place("s16-itch", 642);
          const url = place("s16-url", 738);
          const legal = place("s16-legal", 990);
          legal.style.color = "rgba(240, 232, 212, 0.62)";
          const debt = document.getElementById("s16-deuda");
          debt.style.top = "831px";

          // El golpe: fogonazo de dos fotogramas, ficha girando, titulo de golpe.
          tl.set("#s16-flash", { opacity: 1 }, 0);
          tl.set("#s16-flash", { opacity: 0.45 }, 1 / 60);
          tl.set("#s16-flash", { opacity: 0 }, 2 / 60);
          tl.set("#s16-negro", { opacity: 0 }, 0);
          let t = 0;
          let dt = 0.03;
          let i = 0;
          while (t < 1.6 || i % 8 !== 0) {
            tl.set(chip, { backgroundPosition: frame(i) }, t);
            t += dt;
            dt = Math.min(0.11, dt * 1.06);
            i += 1;
          }
          tl.set(chip, { backgroundPosition: frame(0) }, t);
          T.slam(tl, t1, 0);
          T.slam(tl, t2, 0);
          T.jolt(tl, chip, 0, 3);
          T.jolt(tl, t1, 0, 3);
          T.jolt(tl, t2, 0, 3);

          const after = T.type(tl, itch, 0.9, 30);
          T.type(tl, url, after + 0.15, 40);
          T.slam(tl, legal, 2.6);

          // La deuda: arranca en la cifra real y sube cada vez mas rapido. El texto sale de un
          // objeto que GSAP interpola, asi que buscar cualquier instante pinta la cifra exacta.
          const label = (texts.debt_label || "DEUDA") + " ";
          const sep = texts.thousands || ".";
          const counter = { v: 88888000 };
          const paint = function () {
            debt.textContent = label + T.money(counter.v, sep);
            T.center(debt, 960);
          };
          paint();
          tl.set(debt, { opacity: 0 }, 0);
          tl.set(debt, { opacity: 1 }, 2.0);
          tl.fromTo(counter, { v: 88888000 }, {
            v: 88888000 + 6200000, duration: 6.5, ease: "power2.in", onUpdate: paint,
          }, 2.0);
          T.stepFade(tl, "#s16-negro", 0, 1, 8.45, 0.5, 4);
          window.__timelines["s16"] = tl;
        });
      })();
