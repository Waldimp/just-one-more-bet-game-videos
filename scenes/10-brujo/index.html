<!--
  10 · El Brujo (126). Do7M9, Fa7M y Fa7M: lo mistico, con el vibrafono suelto.
  Corte 1: el saludo del Brujo (su frase de verdad, en su globo). Tiempo 4: su tienda de
  pines y una compra (con el plano del casino, el articulo fijo de la tienda). Tiempo 8: la
  camisa llenandose de pines, uno por golpe. La camisa es la pestana CAMISA de la pausa, que
  ocupa todo el cuadro con sus pestanas arriba (CAMISA, MAPA, CONFIGURACION): el rotulo se va
  en ese corte para no tapar la de MAPA.
  Al final, el PASE DE CARRETE: cinco carretes que bajan y tapan el cuadro, y el montaje sale
  de ellos.
-->
