<!doctype html>
<!--

  Corte 2 (tiempos 4-8): el blackjack, x2 sobre la mesa. 16, pide, la carta llega boca abajo,
  se voltea en el tiempo 5 y es un rey: 26.

        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s07-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;

        const cut = T.beat(SCENE, 4);
        const rest = T.growBox(tl, b, 1464, 249, [cut, cut, cut]);
        T.slam(tl, rest[0], cut);
        const end = T.type(tl, rest[1], cut, 36);
        T.type(tl, rest[2], end + 0.05, 36);
