    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "11-montaje";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s11-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          T.reelPass(tl, document.getElementById("s11-pase"), "out", 0, 0.2);
          // Tres veces, cada una mas grande y mas abajo, a golpe: tiempos 6, 12 y 18.
          [["#s11-uno", 6, 10, 336], ["#s11-dos", 12, 16, 450], ["#s11-tres", 18, 24, 570]]
            .forEach(function (item) {
              const el = document.querySelector(item[0]);
              el.style.top = item[3] + "px";
              T.center(el, 960);
              T.slam(tl, el, T.beat(SCENE, item[1]));
              T.jolt(tl, el, T.beat(SCENE, item[1]), 2);
              if (item[2] < 24) T.hide(tl, el, T.beat(SCENE, item[2]));
            });
          window.__timelines["s11"] = tl;
        });
      })();
