<!doctype html>
<!--
  15 · La palanca de cerca, x3 (con los dos ultimos carretes al lado): quieta mientras sube el
  tictac de la musica, y al final tira otra vez (el giro empieza a sonar justo antes del
  golpe del logo). Texto grande abajo, para no tapar la palanca: "Solo una más.", despacio.
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>15 · Solo una más</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s15-root"
      data-composition-id="s15"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <div class="zoom" style="transform: translate(-2376px, -1485px) scale(3)">
          <video id="s15-palanca" class="clip" src="captures/15_palanca.mp4" data-start="0"
            data-duration="6" data-media-start="0.2" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="t c6" id="s15-texto" data-t="line">Solo una más.</div>

      <audio id="s15-sonido" src="captures/15_palanca.wav" data-start="0" data-duration="6"
        data-media-start="0.2" data-volume="0.34" data-track-index="10"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "15-solo-una-mas";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s15-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const text = document.getElementById("s15-texto");
          text.style.top = "855px";
          T.center(text, 960);
          T.type(tl, text, 1.3, 9);
          window.__timelines["s15"] = tl;
        });
      })();
    </script>
  </body>
</html>
