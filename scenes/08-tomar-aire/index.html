<!doctype html>
<!--
  08 · El chiste (112). La musica se queda en el contrabajo solo.
  La sala de fumadores, x3 sobre ella: se lleva el cigarro a la boca y suelta el humo en el
  tiempo 3. En el tiempo 5, golpe de zoom a x6: se queda mirando a camara (la hoja de fumar
  del juego solo existe de frente). Texto arriba, en dos golpes, cuando ya esta mirando.
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>08 · Tomar aire</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s08-root"
      data-composition-id="s08"
      data-start="0"
      data-duration="4.283333"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <div class="zoom" style="transform: translate(-360px, -972px) scale(3)">
          <video data-media-start="1.3833" data-duration="2.6833" data-start="0" id="s08-fumar" class="clip" src="captures/08_fumar.mp4"
          data-beats="0 5" data-sync="3.0@3" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <!-- Tiempo 5: golpe de zoom a x6 sobre la cara. Se queda mirando a camara. -->
      <div class="shot">
        <div class="zoom" style="transform: translate(-1332px, -2592px) scale(6)">
          <video data-media-start="4.0667" data-duration="1.6" data-start="2.6833" id="s08-mirada" class="clip" src="captures/08_fumar.mp4"
          data-beats="5 end" data-sync="3.0@3" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="uibox" id="s08-caja">
        <div class="t line" data-t="l1">(Es tabaco.</div>
        <div class="t line" data-t="l2">Probablemente.)</div>
      </div>

      <audio data-media-start="1.3833" data-duration="4.2833" data-start="0" id="s08-sonido" src="captures/08_fumar.wav" data-beats="0 end" data-sync="3.0@3"
        data-volume="0.49" data-track-index="10"></audio>
      <audio data-start="1.6167" id="s08-humo" src="sfx/exhale.wav" data-beats="3" data-duration="1.6"
        data-volume="0.6" data-track-index="11"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "08-tomar-aire";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s08-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const box = document.getElementById("s08-caja");
        const lines = T.growBox(tl, box, 960, 36, [T.beat(SCENE, 5), T.beat(SCENE, 6.5)]);
        T.slam(tl, lines[0], T.beat(SCENE, 5));
        T.slam(tl, lines[1], T.beat(SCENE, 6.5));
          window.__timelines["s08"] = tl;
        });
      })();
    </script>
  </body>
</html>
