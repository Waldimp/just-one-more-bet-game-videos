<!doctype html>
<!--
  06 · La tragamonedas (100). Do7M9 y Fa7M: lo bonito.
  La misma tirada del juego, grabada a ritmo de trailer: tira de la palanca, cuatro sietes a
  x4 y el quinto carrete a camara lenta (x0,35). Cae en el tiempo 5 y salta el GANASTE con su
  lluvia de monedas. Zoom x2 sobre la maquina. Sonido: el del juego, grabado con la imagen.
  Texto: en una caja de la interfaz del juego, cuando cae el quinto siete.
-->
<html
  lang="es"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>06 · La tragamonedas</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/js/cues.js"></script>
    <script src="shared/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="s06-root"
      data-composition-id="s06"
      data-start="0"
      data-duration="4.8"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div class="shot">
        <div class="zoom" style="transform: translate(-828px, -660px) scale(2)">
          <video data-media-start="0.15" data-duration="4.8" data-start="0" id="s06-maquina" class="clip" src="captures/06_slots_lento.mp4"
          data-beats="0 end" data-sync="3.15@5" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="uibox" id="s06-caja"><div class="t line" data-t="line">Ganar se siente bien.</div></div>

      <audio data-media-start="0.15" data-duration="4.8" data-start="0" id="s06-sonido" src="captures/06_slots_lento.wav" data-beats="0 end" data-sync="3.15@5"
        data-volume="0.41" data-track-index="10"></audio>
    </div>

    <script>
      // Todo dentro de una funcion: en el index.html del trailer completo las 16 escenas
      // comparten pagina, y cada una tiene que quedarse con lo suyo.
      (function () {
        const SCENE = "06-tragamonedas";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("s06-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const box = document.getElementById("s06-caja");
          box.style.top = "849px";
          T.center(box, 960);
          T.type(tl, box.querySelector(".t"), T.beat(SCENE, 5), 34);
          tl.set(box, { opacity: 0 }, 0);
          tl.set(box, { opacity: 1 }, T.beat(SCENE, 5));
          window.__timelines["s06"] = tl;
        });
      })();
    </script>
  </body>
</html>
