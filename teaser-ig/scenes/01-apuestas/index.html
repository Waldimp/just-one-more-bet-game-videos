  Teaser IG · 01 · Las apuestas (0:00-0:09,65). La musica es el montaje del trailer entero:
  accelerando de 132 a 168 que acaba en la dominante y no resuelve.
  Gancho en el primer fotograma: los carretes girando a x6 y "¿TE LA JUGAS?"; caen cinco
  sietes y el cartel GANASTE con la lluvia de monedas (x3, el cuadro entero). Luego cortes cada
  dos tiempos: la bola de la ruleta cae en el 2, el final de foto de los caballos (la
  repeticion cenital cruzando la meta), el dinero que sube en la tarjeta del HUD ("GANAS.") y
  la carta que se voltea y es un rey ("PERDES."). Despues cortes cada tiempo, cada vez mas
  rapidos, con "UNA MAS." dos veces; la ultima en rojo hasta el corte en seco. Los rotulos
  de abajo no van en rojo sobre la alfombra roja de las mesas: ahi no se leen.
  Todo es el juego en vertical (360x640 a x3, la composicion de movil). Los zooms son x6
  (scale(2) sobre el clip x3). La tarjeta del HUD a x6 se baja 252 px: arriba manda la
  cabecera de la historia de Instagram. El gancho recorta los carretes por debajo del texto de
  la barra de arriba de la maquina y deja la pared libre para "¿TE LA JUGAS?".
  Cada corte: data-beats="desde hasta" (tiempos del montaje) y data-sync="segundo_fuente@tiempo".
-->

    <script>
      (function () {
        const SCENE = "01-apuestas";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("t01-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const at = function (i) { return T.beat(SCENE, i); };
          // Lineas apiladas: la caja de cada letra mide 1,3 em y se pisa con la de la linea de
          // arriba, aunque la tinta no se toque. Se marca como buscado para `hyperframes check`.
          const stacked = function (el) {
            T.split(el).forEach(function (ch) { ch.setAttribute("data-layout-allow-overlap", ""); });
          };
          stacked(document.getElementById("t01-gancho1"));
          stacked(document.getElementById("t01-gancho2"));
          // [id, top, desde, hasta (null = hasta el final), sacudida]. Los de abajo, bajo el
          // boton TERMINAR DIA de la tarjeta del HUD a x6 y por encima de la barra de respuesta.
          [
            ["#t01-gancho1", 252, 0, 3, 3],
            ["#t01-gancho2", 384, 0, 3, 3],
            ["#t01-ganas", 1392, 8.25, 10, 2],
            ["#t01-pierdes", 1392, 11.4, 12, 3],
            ["#t01-una1", 1407, 14, 18, 2],
            ["#t01-una2", 1392, 19, null, 3],
          ].forEach(function (item) {
            const el = document.querySelector(item[0]);
            el.style.top = item[1] + "px";
            T.center(el, 540);
            if (item[2] === 0) {
              // El gancho ya esta en el fotograma 0: visible de entrada, no por un `set` en el
              // instante 0 (el render no lo pinta en el primer fotograma).
              T.split(el).forEach(function (ch) { ch.style.opacity = "1"; });
              if (item[4]) T.jolt(tl, el, 1 / 60, item[4]);
            } else {
              T.slam(tl, el, at(item[2]));
              if (item[4]) T.jolt(tl, el, at(item[2]), item[4]);
            }
            if (item[3] !== null) T.hide(tl, el, at(item[3]));
          });
          window.__timelines["t01"] = tl;
        });
      })();
