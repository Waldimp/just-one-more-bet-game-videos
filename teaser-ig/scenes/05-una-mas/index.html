<!doctype html>
<!--
  Teaser IG · 05 · ¿Solo una mas? (0:15,25). El final del platillo al reves y el tictac de
  carrete de la palanca del trailer, que crece hasta el golpe del cierre.
  La tragamonedas a x6, la palanca a la derecha. "¿SOLO / UNA MAS?" y, al final, tira otra vez:
  los carretes echan a girar y se corta antes de saber que sale.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Teaser 05 · Solo una mas</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="teaser-ig/js/cues.js"></script>
    <script src="teaser-ig/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <link rel="stylesheet" href="teaser-ig/css/teaser.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="t05-root"
      data-composition-id="t05"
      data-start="0"
      data-duration="2"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div class="shot" id="t05-plano">
        <div class="zoom" data-layout-allow-overflow style="transform: translate(-660px, -480px) scale(2)">
          <video id="t05-c00" class="clip" src="teaser-ig/captures/ig_palanca.mp4" data-start="0"
            data-duration="2" data-media-start="0.05" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="t c5" id="t05-l1" data-t="l1">¿SOLO</div>
      <div class="t c5" id="t05-l2" data-t="l2">UNA MÁS?</div>

      <!-- La palanca baja en el segundo 1,6 del clip: 1,55 de la escena. -->
      <audio id="t05-juego" src="teaser-ig/captures/ig_palanca.wav" data-start="0"
        data-duration="2" data-media-start="0.05" data-volume="0.55" data-track-index="10"></audio>
    </div>

    <script>
      (function () {
        const SCENE = "05-una-mas";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("t05-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          const l1 = document.getElementById("t05-l1");
          const l2 = document.getElementById("t05-l2");
          l1.style.top = "1236px";
          l2.style.top = "1371px";
          T.center(l1, 540);
          T.center(l2, 540);
          T.slam(tl, l1, 0.2);
          T.slam(tl, l2, 0.62);
          T.jolt(tl, l2, 0.62, 2);
          T.jolt(tl, "#t05-plano", 1.55, 2);
          window.__timelines["t05"] = tl;
        });
      })();
    </script>
  </body>
</html>
