<!doctype html>
<!--
  Teaser IG · 03 · El reloj (0:11,40). Silencio y tictac. La tarjeta del HUD a x6 (bajada
  252 px por la cabecera de la historia): 0:04, 0:03, 0:02, 0:01 y 0:00 en rojo, que parpadea.
  Cada cambio del reloj, un tic. Debajo: "150 SEGUNDOS / AL DIA."
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Teaser 03 · El reloj</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="teaser-ig/js/cues.js"></script>
    <script src="teaser-ig/js/texts.js"></script>
    <script src="shared/js/trailer.js"></script>
    <link rel="stylesheet" href="shared/css/trailer.css" />
    <link rel="stylesheet" href="teaser-ig/css/teaser.css" />
    <style>
      @font-face {
        font-family: "Geist Pixel Trailer";
        src: url("shared/fonts/GeistPixelTrailer.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="t03-root"
      data-composition-id="t03"
      data-start="0"
      data-duration="1.65"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div class="shot">
        <div class="zoom" data-layout-allow-overflow style="transform: translate(0px, 252px) scale(2)">
          <video id="t03-c00" class="clip" src="teaser-ig/captures/ig_reloj.mp4" data-start="0"
            data-duration="1.65" data-media-start="0.25" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div class="t c4" id="t03-l1" data-t="l1">150 SEGUNDOS</div>
      <div class="t c4" id="t03-l2" data-t="l2">AL DÍA.</div>

      <!-- El reloj cambia en los segundos 0,4 / 0,8 / 1,2 / 1,6 del clip: 0,15 / 0,55 / 0,95 /
           1,35 de la escena. -->
      <audio id="t03-ambiente" src="sfx/casino_ambience.mp3" data-start="0"
        data-duration="1.65" data-media-start="31.75" data-volume="0.6" data-track-index="10"></audio>
      <audio id="t03-tic1" src="sfx/tick.wav" data-start="0.15" data-duration="0.4"
        data-volume="0.8" data-track-index="11"></audio>
      <audio id="t03-tic2" src="sfx/tock.wav" data-start="0.55" data-duration="0.4"
        data-volume="0.8" data-track-index="12"></audio>
      <audio id="t03-tic3" src="sfx/tick.wav" data-start="0.95" data-duration="0.4"
        data-volume="0.8" data-track-index="11"></audio>
      <audio id="t03-tic4" src="sfx/tock.wav" data-start="1.35" data-duration="0.3"
        data-volume="1" data-track-index="12"></audio>
    </div>

    <script>
      (function () {
        const SCENE = "03-reloj";
        const tl = gsap.timeline({ paused: true });
        const ROOT = document.getElementById("t03-root");
        document.fonts.ready.then(function () {
          const T = TRAILER;
          T.fill(SCENE, ROOT);
          [["#t03-l1", 1260, 0.15], ["#t03-l2", 1371, 0.55]].forEach(function (item) {
            const el = document.querySelector(item[0]);
            el.style.top = item[1] + "px";
            T.center(el, 540);
            T.slam(tl, el, item[2]);
          });
          window.__timelines["t03"] = tl;
        });
      })();
    </script>
  </body>
</html>
